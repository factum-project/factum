[workspace]
resolver = "2"
members = [
    "crates/factum-core",
    "crates/factum-rt",
    "crates/factum-mcp",
    "crates/factum-bench",
    "crates/factum-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Factum Project"]
description = "A structured knowledge representation language for LLMs"

[workspace.dependencies]
# Internal (path + version for crates.io publishing)
factum-core = { path = "crates/factum-core", version = "0.1.0" }
factum-rt = { path = "crates/factum-rt", version = "0.1.0" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
parking_lot = "0.12"
ahash = "0.8"
