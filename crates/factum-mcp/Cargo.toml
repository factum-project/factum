[package]
name = "factum-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP bridge for Factum — JSON-RPC tools and resources"
repository = "https://github.com/factum-project/factum"
readme = "README.md"

[features]
default = []
rocksdb = ["factum-rt/rocksdb"]
http = ["dep:axum", "dep:tokio", "dep:tower-http"]

[dependencies]
factum-core.workspace = true
factum-rt.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
smol_str.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
# HTTP transport dependencies (optional, feature-gated)
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors", "limit"] }

[[bin]]
name = "factum-mcp-server"
path = "src/bin/stdio.rs"

[[bin]]
name = "factum-mcp-http"
path = "src/bin/http.rs"
required-features = ["http"]
