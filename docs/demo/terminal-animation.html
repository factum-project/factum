<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factum MCP Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1b26;
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Menlo', monospace;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; overflow: hidden;
}
.terminal {
  width: 800px; height: 450px;
  background: #1a1b26; border-radius: 12px;
  border: 1px solid #2a2e3e;
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 0 40px rgba(0,0,0,0.3);
  position: relative;
}
.titlebar {
  height: 36px; background: #16161e; display: flex;
  align-items: center; padding: 0 16px; gap: 8px;
  border-bottom: 1px solid #2a2e3e;
  flex-shrink: 0;
}
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.r { background: #f7768e; } .dot.y { background: #e0af68; } .dot.g { background: #9ece6a; }
.titletext { margin-left: 10px; font-size: 14px; color: #565f89; }
.badge {
  margin-left: auto; font-size: 11px; color: #414868;
  border: 1px solid #2a2e3e; border-radius: 4px; padding: 2px 6px;
}
.body {
  flex: 1; padding: 16px 22px; overflow: hidden;
  font-size: 18px; line-height: 1.7;
}
.line { white-space: pre-wrap; word-break: break-word; min-height: 1px; }
.prompt { color: #bb9af7; font-weight: 600; }
.label { color: #7aa2f7; font-size: 15px; }
.fade { color: #414868; font-size: 15px; }
.mcp { color: #9ece6a; }
.highlight { color: #e0af68; font-weight: bold; }
.prov { color: #ff9e64; }
.conf { color: #73daca; }
.dim { color: #6272a4; font-size: 15px; }
.section { color: #565f89; font-size: 15px; border-top: 1px solid #2a2e3e; padding-top: 6px; margin-top: 4px; }
</style>
</head>
<body>
<div class="terminal">
  <div class="titlebar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <span class="titletext">Claude Code &mdash; factum-mcp-server</span>
    <span class="badge">simulated session</span>
  </div>
  <div class="body" id="body"></div>
</div>
</body>
</html>
